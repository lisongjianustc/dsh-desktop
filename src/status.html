<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Desktop</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #0b0f1a;
    color: #e6e9f2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .whale { width: 96px; height: 96px; }
  .whale.pulse { animation: breathe 2.2s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.94); opacity: 0.75; }
  }
  h1 { font-size: 20px; font-weight: 600; }
  p.desc { color: #9aa3b8; font-size: 13px; max-width: 520px; text-align: center; line-height: 1.6; }
  .spinner { width: 22px; height: 22px; border: 2px solid #2a3350; border-top-color: #4D6BFE; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #4D6BFE; color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #5d78ff; }
  button.secondary { background: #1c2337; color: #cdd4e6; }
  button.secondary:hover { background: #28304a; }
  details { width: min(760px, 90vw); background: #101627; border: 1px solid #232c47; border-radius: 10px; }
  summary { padding: 8px 14px; font-size: 12px; color: #9aa3b8; cursor: pointer; user-select: none; }
  pre {
    padding: 0 14px 12px; font-size: 11px; line-height: 1.5; color: #a8b3cc;
    max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .hidden { display: none; }
</style>
</head>

  <h1 id="title">正在启动后端…</h1>
  <p class="desc" id="desc">正在定位 dsh 并启动 Web 服务，首次启动可能需要数十秒。</p>
  <div class="spinner" id="spinner"></div>
  <div class="row">
    <button id="btn-restart" class="hidden">重启后端</button>
    <button id="btn-settings" class="secondary">设置…</button>
    <button id="btn-logs" class="secondary">打开日志</button>
    <button id="btn-quit" class="secondary">退出</button>
  </div>
  <details id="logwrap" class="hidden">
    <summary>后端日志（最近 300 行）</summary>
    <pre id="log"></pre>
  </details>

<script>
  const $ = (id) => document.getElementById(id)
  const setMode = (mode) => {
    const starting = mode === 'starting'
    $('spinner').classList.toggle('hidden', !starting)
    $('whale').classList.toggle('pulse', starting)
    $('logwrap').classList.remove('hidden')
    if (mode === 'starting') {
      $('title').textContent = '正在启动后端…'
      $('desc').textContent = '正在定位 dsh 并启动 Web 服务，首次启动可能需要数十秒。'
      $('btn-restart').classList.add('hidden')
    } else if (mode === 'crashed') {
      $('title').textContent = '后端已退出'
      $('desc').textContent = 'dsh 后端进程意外退出。日志见下方，可尝试重启。'
      $('btn-restart').classList.remove('hidden')
    } else if (mode === 'notinstalled') {
      $('title').textContent = '未找到 dsh'
      $('desc').textContent = 'DSH Desktop 需要本机安装的 dsh 提供 Web 界面。请打开「设置」选择 pnpm/npx 启动方式、安装 dsh（pnpm add -g @deepseek-ai/dsh）或配置 dsh 路径。'
      $('btn-restart').classList.remove('hidden')
      $('btn-restart').textContent = '重新检测'
    }
  }
  $('btn-restart').addEventListener('click', () => desktopStatus.restart())
  $('btn-settings').addEventListener('click', () => desktopStatus.openSettings())
  $('btn-logs').addEventListener('click', () => desktopStatus.openLogs())
  $('btn-quit').addEventListener('click', () => desktopStatus.quit())
  const mode = new URLSearchParams(location.search).get('mode') || 'starting'
  setMode(mode)
  const refreshLog = async () => {
    const lines = await desktopStatus.logTail()
    $('log').textContent = lines.join('\n')
    $('logwrap').scrollTop = $('logwrap').scrollHeight
  }
  refreshLog()
  setInterval(refreshLog, 1500)
</script>
